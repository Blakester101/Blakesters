<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michael Jackson Tribute</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <p class="eyebrow">Tribute Website</p>
      <h1>Michael Jackson</h1>
      <p class="subtitle">The King of Pop — singer, songwriter, dancer, and global icon.</p>
      <button id="quoteBtn">Show a Michael Jackson Quote</button>
      <p id="quoteOutput" class="quote"></p>
    </header>

    <main class="container">
      <section class="card">
        <h2>Top 50 Michael Jackson Songs</h2>
        <p>Click any song row to open a pop-up with song details.</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Song</th>
                <th>Duration</th>
                <th>Artist</th>
              </tr>
            </thead>
            <tbody id="songsBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="songModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-content">
        <button id="closeModal" class="close-btn">✕</button>
        <h3 id="modalTitle"></h3>
        <ul id="songMeta"></ul>
        <h4>Lyrics</h4>
        <p id="lyricsNote"></p>
      </div>
    </div>

    <footer>
      <p>Made with admiration for Michael Jackson's musical legacy.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
